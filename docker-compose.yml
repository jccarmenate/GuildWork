services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: guildwork
      POSTGRES_PASSWORD: guildwork
      POSTGRES_DB: guildwork
    ports:
      - "5432:5432"
    volumes:
      - guildwork_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://guildwork:guildwork@postgres:5432/guildwork
      PORT: 4000
      FRONTEND_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: dev-only-access-secret
      JWT_REFRESH_SECRET: dev-only-refresh-secret
    ports:
      - "4000:4000"
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  guildwork_postgres_data:
